mutation CreateUserData @transaction @auth(level: USER) {
  user_insert(data: {
    id_expr: "auth.uid",
    email: "user@example.com",
    displayName: "New User"
  })
}

mutation UpdateUser @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {displayName: "Updated Name"})
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetCurrentUser @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) {
    email
    displayName
  }
}

query ListAllUsers @auth(level: PUBLIC, insecureReason: "Publicly listing user profiles for discovery") {
  users {
    id
    displayName
  }
}

mutation CreateProject($name: String!, $description: String) @auth(level: USER) {
  project_insert(data: {
    name: $name,
    description: $description,
    owner: {id_expr: "auth.uid"}
  })
}

mutation UpdateProject($id: UUID!, $name: String) @auth(level: USER) {
  project_update(id: $id, data: {name: $name})
}

mutation DeleteProject($id: UUID!) @auth(level: USER) {
  project_delete(id: $id)
}

query GetProject($id: UUID!) @auth(level: PUBLIC, insecureReason: "Project details are public") {
  project(id: $id) {
    name
    description
  }
}

query ListProjects @auth(level: PUBLIC, insecureReason: "Listing all projects for discovery") {
  projects {
    id
    name
  }
}

mutation CreateTask($title: String!, $status: String!, $projectId: UUID!) @auth(level: USER) {
  task_insert(data: {
    title: $title,
    status: $status,
    project: {id: $projectId}
  })
}

mutation UpdateTask($id: UUID!, $status: String!) @auth(level: USER) {
  task_update(id: $id, data: {status: $status})
}

mutation DeleteTask($id: UUID!) @auth(level: USER) {
  task_delete(id: $id)
}

query GetTask($id: UUID!) @auth(level: PUBLIC, insecureReason: "Tasks are visible to public") {
  task(id: $id) {
    title
    status
  }
}

query ListTasks @auth(level: PUBLIC, insecureReason: "Listing tasks for visibility") {
  tasks {
    id
    title
  }
}

mutation CreateComment($content: String!, $taskId: UUID!) @auth(level: USER) {
  comment_insert(data: {
    content: $content,
    task: {id: $taskId},
    author: {id_expr: "auth.uid"}
  })
}

mutation UpdateComment($id: UUID!, $content: String!) @auth(level: USER) {
  comment_update(id: $id, data: {content: $content})
}

mutation DeleteComment($id: UUID!) @auth(level: USER) {
  comment_delete(id: $id)
}

query GetComment($id: UUID!) @auth(level: PUBLIC, insecureReason: "Comments are public") {
  comment(id: $id) {
    content
  }
}

query ListComments @auth(level: PUBLIC, insecureReason: "Listing all comments") {
  comments {
    id
    content
  }
}

mutation JoinProject($projectId: UUID!, $role: String!) @auth(level: USER) {
  projectMember_insert(data: {
    projectId: $projectId,
    userId_expr: "auth.uid",
    role: $role
  })
}

mutation UpdateMemberRole($projectId: UUID!, $role: String!) @auth(level: USER) {
  projectMember_update(key: {projectId: $projectId, userId_expr: "auth.uid"}, data: {role: $role})
}

mutation LeaveProject($projectId: UUID!) @auth(level: USER) {
  projectMember_delete(key: {projectId: $projectId, userId_expr: "auth.uid"})
}

query GetProjectMember($projectId: UUID!, $userId: UUID!) @auth(level: PUBLIC, insecureReason: "Membership status is public") {
  projectMember(key: {projectId: $projectId, userId: $userId}) {
    role
  }
}

query ListProjectMembers @auth(level: PUBLIC, insecureReason: "Listing all project members") {
  projectMembers {
    projectId
    userId
    role
  }
}